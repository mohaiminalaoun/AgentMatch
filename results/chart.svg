<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Team quality vs. privacy leakage</title>
<desc id="chart-desc">random: per-person quality 0.343, leakage 0.0%, needs a trusted party; greedy: per-person quality 0.532, leakage 0.0%, needs a trusted party; local search: per-person quality 0.589, leakage 0.0%, needs a trusted party; broadcast: per-person quality 0.589, leakage 87.4%, no trusted party; agents: per-person quality 0.425, leakage 14.9%, no trusted party.</desc>
<style>
	svg { --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --agents: #2a78d6; --context: #898781; }
	@media (prefers-color-scheme: dark) {
		svg { --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835; --agents: #3987e5; --context: #898781; }
	}
	text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
	.title { font-size: 17px; font-weight: 600; fill: var(--ink); }
	.subtitle { font-size: 12.5px; fill: var(--ink-2); }
	.tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
